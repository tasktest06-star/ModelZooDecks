device: MAX32690
family: MAX32
vendor: Analog Devices
cores:
  cpu: Cortex-M4F @ 120 MHz
  fpu: yes
sram_kb: 1024
flash_kb: 3072
power_mw:
  active: 3.5
  sleep: 0.004
use_case: ultra_low_power_inference
# No dedicated CNN accelerator — runs TFLite Micro or bare-metal kernels
supported_models:
  keyword_spotting_simple:
    task: kws
    input_shape: [1, 40, 51]
    latency_ms: 12.0
    accuracy_pct: 90.2
    sram_kb: 128
    framework: tflite_micro
  anomaly_detection:
    task: anomaly
    input_shape: [1, 64]
    latency_ms: 0.8
    auc: 0.94
    sram_kb: 32
    framework: cmsis_nn
  vibration_classifier:
    task: classification
    input_shape: [1, 256]
    latency_ms: 5.0
    accuracy_pct: 91.5
    sram_kb: 96
    framework: cmsis_nn
    num_classes: 4
